<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beach Football League</title>
<meta name="description" content="This web application streamlines team management for players and organizers, offering features like player registration, draft boards, and game schedules.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --navy: #0d2136;
    --navy2: #153450;
    --navy3: #1d4462;
    --orange: #e8823a;
    --orange2: #d4602a;
    --sand: #f2e8d5;
    --cream: #faf6ee;
    --teal: #2c7a8c;
    --teal-light: #6db8c7;
    --ink: #0d2136;
    --line: rgba(13,33,54,0.12);
    --shadow: 0 10px 30px rgba(13,33,54,0.12);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  button { font-family: inherit; cursor: pointer; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(13,33,54,0.2); border-radius: 3px; }

  .rsvp-yes { background: #d1fae5; color: #065f46; }
  .rsvp-no  { background: #fee2e2; color: #991b1b; }
  .rsvp-pending { background: var(--sand); color: var(--navy); }

  .dragging { opacity: 0.4; }
  .drop-target { outline: 2px dashed var(--orange); outline-offset: 2px; }

  .standings-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  .standings-table th { text-align: left; padding: 10px 12px; background: var(--navy); color: var(--sand); font-family: 'Space Mono', monospace; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
  .standings-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .standings-table tbody tr:hover { background: rgba(13,33,54,0.04); }
  .standings-table tbody tr:last-child td { border-bottom: none; }

  @media (max-width: 768px) {
    input, select, textarea { font-size: 16px !important; }
    .nav-compact { padding: 10px 16px; }
  }

  /* Sync status bar */
  #sync-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    text-align: center;
    padding: 6px 16px;
    padding-top: calc(6px + env(safe-area-inset-top, 0px));
    background: var(--navy);
    color: var(--sand);
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.3px;
  }
  #sync-bar.sync-error { background: #7a1f1f; }
  #sync-bar strong { color: var(--orange); }
</style>
</head>

  // show a visible message instead of leaving a silent blank page.
  window.addEventListener('error', function(e){

      root.innerHTML = '<div style="padding:24px;font-family:monospace;font-size:13px;color:#991b1b;background:#fee2e2;white-space:pre-wrap;">Page failed to load:\n' +
        (e.message || (e.target && e.target.src) || 'unknown error') + '</div>';
    }
  }, true);
</script>

// ---- Data layer (Firestore + localStorage fallback) ----
// Data layer — talks to Firestore via the "compat" global build.
// Same dbGet/dbSet/dbGetAll shape as your real src/api.ts, so App.js needs
// no changes. Falls back to localStorage if Firestore can't be reached
// (e.g. security rules not published yet, or the database not created).

let db = null;
let statusEl = null, barEl = null;
function setStatus(text, isError) {
  if (!statusEl) statusEl = document.getElementById('fb-status');
  if (!barEl) barEl = document.getElementById('sync-bar');
  if (statusEl) statusEl.textContent = text;
  if (barEl) barEl.classList.toggle('sync-error', !!isError);
}

try {
  if (!window.firebase.apps.length) {
    window.firebase.initializeApp(firebaseConfig);
  }
  db = window.firebase.firestore();
  setStatus('Connected to Firestore (' + firebaseConfig.projectId + ')');
} catch (e) {
  console.warn('Firebase init failed, falling back to localStorage', e);
  setStatus('Firestore unavailable — using local-only fallback', true);
}

const COLLECTION = 'app_data';

async function dbGet(key, fallback) {
  if (db) {
    try {
      const snap = await db.collection(COLLECTION).doc(key).get();
      if (snap.exists) {
        const data = snap.data();
        return data && 'value' in data ? data.value : fallback;
      }
      return fallback;
    } catch (e) {
      console.warn('dbGet failed for', key, e);
      setStatus('Firestore read failed — check your security rules', true);
    }
  }
  try {
    const v = localStorage.getItem('bfl_' + key);
    return v ? JSON.parse(v) : fallback;
  } catch {
    return fallback;
  }
}

async function dbSet(key, value) {
  try { localStorage.setItem('bfl_' + key, JSON.stringify(value)); } catch {}
  if (db) {
    try {
      await db.collection(COLLECTION).doc(key).set({ value });
      return;
    } catch (e) {
      console.warn('dbSet failed for', key, e);
      setStatus('Firestore write failed — check your security rules', true);
    }
  }
}

async function dbGetAll(keys) {
  const out = {};
  if (db) {
    try {
      const results = await Promise.all(
        keys.map(k => db.collection(COLLECTION).doc(k).get())
      );
      keys.forEach((k, i) => {
        const snap = results[i];
        out[k] = snap.exists && snap.data() && 'value' in snap.data() ? snap.data().value : null;
      });
      return out;
    } catch (e) {
      console.warn('dbGetAll failed', e);
      setStatus('Firestore read failed — check your security rules', true);
    }
  }
  keys.forEach(k => {
    try {
      const v = localStorage.getItem('bfl_' + k);
      out[k] = v ? JSON.parse(v) : null;
    } catch {
      out[k] = null;
    }
  });
  return out;
}

function computeStandings(teams, games) {
    const rows = teams.map((team, index) => ({ team, index, played: 0, wins: 0, losses: 0, ties: 0, for: 0, against: 0, points: 0 }));
    games.filter(hasFinalScore).forEach(g => {
        const a = rows[g.teamA], b = rows[g.teamB];
        if (!a || !b)
            return;
        a.played++;
        b.played++;
        a.for += g.scoreA;
        a.against += g.scoreB;
        b.for += g.scoreB;
        b.against += g.scoreA;
        if (g.scoreA > g.scoreB) {
            a.wins++;
            b.losses++;
            a.points += 2;
        }
        else if (g.scoreB > g.scoreA) {
            b.wins++;
            a.losses++;
            b.points += 2;
        }
        else {
            a.ties++;
            b.ties++;
            a.points++;
            b.points++;
        }
    });
    return rows.sort((a, b) => b.points - a.points || ((b.for - b.against) - (a.for - a.against)) || b.for - a.for || a.team.name.localeCompare(b.team.name));
}

            React.createElement("div", { style: { fontFamily: 'Anton, sans-serif', color: 'var(--cream)', fontSize: '1rem', letterSpacing: 2, textTransform: 'uppercase', opacity: 0.7 } }, "Loading\u2026")));
